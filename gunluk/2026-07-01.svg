<text x="55" y="1406" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">UYARI: %20 artış + %10 azalış, ASLA %10 artış anlamına gelmez</text>
