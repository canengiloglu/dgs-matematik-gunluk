<text x="55" y="1518" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Sıra Sende - Pratik Soru</text>
<text x="55" y="1554" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir mağazada bir ürünün fiyatı önce %25 indirime giriyor. İndirimli</text>
<text x="55" y="1580" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">fiyat üzerinden yapılan %20'lik ek indirim sonrasında, ürünün son</text>
<text x="55" y="1606" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">fiyatı ilk fiyatına göre yüzde kaç azalmıştır?</text>
<text x="55" y="1646" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendi çözümünü tamamlamadan aşağıdaki cevaba bakma!)</text>
