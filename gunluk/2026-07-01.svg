<text x="65" y="994" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: Fiyat, ilk değerine göre %8 ARTMIŞTIR.</text>
