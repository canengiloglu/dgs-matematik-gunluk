<text x="55" y="1120" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: "önce ... sonra", "yeni fiyat üzerinden", "ardından",</text>
