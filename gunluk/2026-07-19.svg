<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2328" viewBox="0 0 1000 2328">
<rect x="0" y="0" width="1000" height="2328" fill="#ffffff"/>
<text x="55" y="60" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">DGS Matematik Günlüğü</text>
<text x="55" y="92" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">19 Temmuz 2026  |  Sınava kalan gün: 0  (SINAV GÜNÜ!)</text>
<line x1="55" y1="108" x2="945" y2="108" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="142" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a56db">Konu: Geometri (Alan / Çevre)</text>
<text x="55" y="190" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">1) Kısa Kural Hatırlatması</text>
<text x="55" y="216" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Dikdörtgen:  Çevre = 2×(a+b)  ,  Alan = a×b   (a: kısa kenar, b: uzun kenar)</text>
<text x="55" y="253.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Kare:  Çevre = 4×a  ,  Alan = </text>
<text x="400.28" y="253.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">a</text>
<text x="410.82" y="246.29999999999998" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.05" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2</text>
<text x="55" y="285.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Üçgen:  Çevre = üç kenarın toplamı  ,  Alan = </text>
<text x="662.7600000000001" y="268.05" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">taban × yükseklik</text>
<line x1="568.9200000000001" y1="274" x2="756.6000000000001" y2="274" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<text x="662.7600000000001" y="290.15" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">2</text>
<text x="55" y="341.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Çember:  Çevre = 2×π×r  ,  Alan = π×</text>
<text x="463.52" y="341.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">r</text>
<text x="474.06" y="334.3" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.05" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2</text>
<text x="55" y="368" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">- ÖNEMLİ: Alan biriminin HER ZAMAN kare birim (cm², m²) olduğunu, çevre /</text>
<text x="55" y="394" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  uzunluk biriminin ise doğrusal (cm, m) olduğunu unutma. İkisini ASLA</text>
<text x="55" y="420" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  karıştırma; bir soruda ikisi birlikte geçiyorsa hangisinin istendiğine dikkat et.</text>
<line x1="55" y1="452" x2="945" y2="452" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="540" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">2) DGS Tarzı Örnek Soru (Geometri + Denklem Kurma)</text>
<text x="55" y="566" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir dikdörtgenin kısa kenarı x cm, uzun kenarı ise kısa kenarının 3 katından</text>
<text x="55" y="592" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2 cm eksiktir. Bu dikdörtgenin çevresi 44 cm olduğuna göre, alanı kaç</text>
<text x="55" y="618" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">cm²'dir?</text>
<text x="55" y="650" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 44      B) 86      C) 96      D) 108      E) 120</text>
<text x="55" y="682" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Çözüm:</text>
<text x="65" y="708" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 1: Kısa kenar = x , Uzun kenar = 3x − 2 olarak tanımla.</text>
<text x="65" y="734" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 2: Çevre formülünü kur: 2 × (x + (3x − 2)) = 44</text>
<text x="65" y="760" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 3: Denklemi çöz: x + 3x − 2 = 22  →  4x − 2 = 22  →  4x = 24  →  x = 6</text>
<text x="65" y="786" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 4: Kenarları bul: kısa kenar = 6 cm , uzun kenar = 3(6) − 2 = 16 cm</text>
<text x="65" y="812" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 5: Alanı hesapla: Alan = 6 × 16 = 96 cm²</text>
<text x="55" y="844" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: C) 96</text>
<text x="55" y="890" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Neden diğer şıklar yanlış (ÖSYM tarzı çeldiriciler):</text>
<text x="65" y="916" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 44  →  Çevre uzunluğu (44 cm) hiç hesap yapılmadan doğrudan alan sanılmış;</text>
<text x="65" y="940" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        cm ile cm² birimleri karıştırılmış (kavram/birim hatası).</text>
<text x="65" y="964" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">B) 86  →  x=6 ve uzun kenar=16 doğru bulunmuş, fakat 6×16 çarpımı dikkatsizce</text>
<text x="65" y="988" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        86 olarak hesaplanmış (doğrusu 96) — işlem/çarpım hatası.</text>
<text x="65" y="1012" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">D) 108  →  Denklem doğru kurulup x=6 bulunmuş, ama "2 eksik" ifadesi</text>
<text x="65" y="1036" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        unutulup uzun kenar = 3x = 18 alınmış; Alan = 6×18 = 108 (eksik adım).</text>
<text x="65" y="1060" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">E) 120  →  "eksik" kelimesi "fazla" olarak okunmuş, uzun kenar = 3x+2 = 20</text>
<text x="65" y="1084" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        alınmış; Alan = 6×20 = 120 (yanlış okuma hatası).</text>
<line x1="55" y1="1116" x2="945" y2="1116" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1204" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">3) Sınavda Bu Soru Tipini Görünce Strateji</text>
<text x="55" y="1230" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: "kenarının ... katından ... eksik/fazladır", "çevresi ... cm",</text>
<text x="55" y="1256" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">"alanı kaç cm²" ifadelerinin BİR ARADA geçmesi → hem cebirsel ifade kurman</text>
<text x="55" y="1282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">hem de geometri formülünü BİRLİKTE kullanman gerektiğinin işaretidir.</text>
<text x="55" y="1318" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İlk adım: Bilinmeyen kısa kenarı x ile tanımla, uzun kenarı x cinsinden yaz;</text>
<text x="55" y="1344" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sözel ifadeyi kurarken cümledeki sırayı koru (önce "kaç katı" → çarpma,</text>
<text x="55" y="1370" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sonra "eksik/fazla" → çıkarma/toplama). ÖNCE çevre denklemini kurup x'i bul,</text>
<text x="55" y="1396" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">SONRA gerçek kenar uzunluklarını hesapla, EN SON sorunun istediği şeyi (alan mı</text>
<text x="55" y="1422" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">çevre mi) hesapla — x'in kendisi asla doğrudan cevap DEĞİLDİR.</text>
<line x1="55" y1="1454" x2="945" y2="1454" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1542" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Öğrencilerin En Sık Düştüğü Tuzak</text>
<text x="55" y="1568" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Hata kalıbı: Öğrenci denklemi çözüp x değerini bulduktan sonra, kenar</text>
<text x="55" y="1594" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">uzunluklarını hesaplamadan x'i (ya da x'e bağlı ifadeyi) doğrudan cevap olarak</text>
<text x="55" y="1620" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">işaretler; ya da alan ve çevre formüllerini karıştırıp çevre değerini alan yerine</text>
<text x="55" y="1646" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kullanır (özellikle ikisi aynı soruda birlikte geçtiğinde).</text>
<text x="55" y="1682" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Nasıl fark edilir: Denklemi çözdükten hemen sonra dur ve sorunun TAM olarak</text>
<text x="55" y="1708" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">neyi istediğini (x mi, bir kenar mı, çevre mi, alan mı) tekrar oku; x bulmak</text>
<text x="55" y="1734" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">çözümün SONU değil ARA adımıdır. Ayrıca birim kontrolü yap: cevap cm² ise</text>
<text x="55" y="1760" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">mutlaka bir çarpma (alan) işleminden, cm ise bir toplama/çevre işleminden</text>
<text x="55" y="1786" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">gelmelidir — birim uyuşmuyorsa formülü karıştırmışsın demektir.</text>
<line x1="55" y1="1818" x2="945" y2="1818" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1906" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">5) Sıra Sende - Pratik Soru</text>
<text x="55" y="1932" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir dikdörtgenin uzun kenarı, kısa kenarının 2 katından 3 cm fazladır. Bu</text>
<text x="55" y="1958" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">dikdörtgenin alanı 65 cm² olduğuna göre, çevresi kaç cm'dir?</text>
<text x="55" y="1990" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 26      B) 32      C) 36      D) 40      E) 65</text>
<text x="55" y="2026" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendi çözümünü tamamlamadan aşağıdaki cevaba bakma!)</text>
<line x1="55" y1="2082" x2="945" y2="2082" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
<rect x="55" y="2094" width="890" height="150" fill="#f6f6f6" stroke="#cccccc" stroke-width="1" rx="8"/>
<text x="65" y="2128" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">CEVAP (spoiler):</text>
<text x="65" y="2154" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Kısa kenar = x , Uzun kenar = 2x + 3   →   x(2x + 3) = 65</text>
<text x="65" y="2178" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2x² + 3x − 65 = 0   →   (2x + 13)(x − 5) = 0   →   x = 5  (pozitif kök)</text>
<text x="65" y="2202" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Uzun kenar = 2(5) + 3 = 13   →   Çevre = 2×(5 + 13) = 36</text>
<text x="65" y="2226" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Doğru şık: C) 36</text>
<text x="55" y="2288" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">Bugün DGS sınav günü! Başarılar!</text>
</svg>
