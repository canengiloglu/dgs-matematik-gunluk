<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2412" viewBox="0 0 1000 2412">
<text x="55" y="30" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">DGS Matematik Günlüğü</text>
<text x="55" y="62" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">6 Ağustos 2026  |  Sınav tarihi geçti: 19 Temmuz 2026 (18 gün önce) — 4. tekrar turu, 7. konu</text>
<line x1="55" y1="94" x2="945" y2="94" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="128" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a56db">Konu: Kümeler</text>
<text x="55" y="168" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">1) Kısa Kural Hatırlatması</text>
<text x="55" y="194" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- İki kümenin birleşiminde ortak elemanlar iki kez sayılmasın diye</text>
<text x="55" y="220" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  kesişim çıkarılır (içerme-dışlama ilkesi):</text>
<text x="75" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">|A∪B| = |A| + |B| − |A∩B|</text>
<text x="55" y="278" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Üç küme için: |A∪B∪C| = |A|+|B|+|C| −|A∩B|−|A∩C|−|B∩C| +|A∩B∩C|</text>
<text x="55" y="304" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Tümleyen (dışında kalanlar): |A'| = |E| − |A|  (E: evrensel/tüm küme)</text>
<text x="55" y="330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- 'hiçbiri' / 'ne...ne de' → tümleyenlerin kesişimi (evrensel − birleşim).</text>
<text x="55" y="356" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- 've' / 'her ikisi de' → kesişim (∩);  'veya' / 'en az biri' → birleşim (∪).</text>
<text x="55" y="382" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- n elemanlı bir kümenin alt küme sayısı:</text>
<text x="75" y="408" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2</text>
<text x="86.78" y="399.45" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12.35" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">n</text>
<text x="104.437" y="408" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  (boş küme ve kümenin kendisi dahil)</text>
<text x="55" y="440" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">- ÖNEMLİ: Yüzde/oranla verilen küme sorularında ÖNCE sayılara çevir,</text>
<text x="55" y="466" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  SONRA içerme-dışlama formülünü uygula. Sırayı karıştırırsan sonuç</text>
<text x="55" y="492" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  yanlış çıkar.</text>
<line x1="55" y1="524" x2="945" y2="524" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="564" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">2) DGS Tarzı Örnek Soru (Yüzde + Kümede İçerme-Dışlama)</text>
<text x="55" y="590" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir dershanede toplam 200 öğrenci vardır. Öğrencilerin %60'ı matematik</text>
<text x="55" y="616" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kursuna, %45'i fizik kursuna kayıtlıdır. Öğrencilerin %5'i ise hiçbir</text>
<text x="55" y="642" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kursa kayıtlı değildir. Buna göre, hem matematik hem fizik kursuna</text>
<text x="55" y="668" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kayıtlı öğrenci sayısı kaçtır?</text>
<text x="55" y="700" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 10      B) 15      C) 20      D) 25      E) 30</text>
<text x="55" y="732" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Çözüm:</text>
<text x="65" y="758" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 1: Matematik kayıtlı: %60 × 200 = 120 öğrenci.</text>
<text x="65" y="784" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 2: Fizik kayıtlı: %45 × 200 = 90 öğrenci.</text>
<text x="65" y="810" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 3: Hiçbirine kayıtlı olmayan: %5 × 200 = 10 öğrenci ⇒ en az bir</text>
<text x="65" y="836" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  kursa kayıtlı olanlar (birleşim): 200 − 10 = 190 öğrenci.</text>
<text x="65" y="862" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 4: İçerme-dışlama formülü: |M∩F| = |M| + |F| − |M∪F|</text>
<text x="65" y="888" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  |M∩F| = 120 + 90 − 190 = 20.</text>
<text x="55" y="922" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: C) 20</text>
<text x="55" y="964" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Neden diğer şıklar yanlış (ÖSYM tarzı çeldiriciler):</text>
<text x="65" y="988" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 10  →  Hiçbirine kayıtlı olmayan %5'lik grubu unutup birleşimi</text>
<text x="65" y="1012" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">     200 sanma: 120+90−200=10 (tam kümeyi 'herkes en az birine</text>
<text x="65" y="1036" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">     kayıtlı' varsayma hatası).</text>
<text x="65" y="1062" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">B) 15  →  %5'lik grubu sayıya çevirirken yanlışlıkla ikiye bölme:</text>
<text x="109.355" y="1086.225" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">10</text>
<line x1="95" y1="1092" x2="123.71000000000001" y2="1092" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<text x="109.355" y="1107.675" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">2</text>
<text x="131.71" y="1098" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a"> = 5 alıp birleşimi 195 sanma → 120+90−195=15.</text>
<text x="65" y="1126" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">D) 25  →  Doğru kurulan 120+90−190 işleminde çıkarma hatası:</text>
<text x="65" y="1150" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">     210−190'ı yanlış hesaplayıp 25 yazma (işlem hatası).</text>
<text x="65" y="1176" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">E) 30  →  %45'i %50 ile karıştırıp fizik kayıtlıyı 100 sanma:</text>
<text x="65" y="1200" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">     120+100−190=30 (yanlış okuma).</text>
<line x1="55" y1="1232" x2="945" y2="1232" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1272" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">3) Sınavda Bu Soru Tipini Görünce Strateji</text>
<text x="55" y="1298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: 'hem...hem/her ikisi de', 'yalnızca/sadece', 'en az</text>
<text x="55" y="1324" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">biri', 'hiçbiri/hiçbirine kayıtlı değil' → bunlar küme sorusu ve</text>
<text x="55" y="1350" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">içerme-dışlama formülü gerektiğinin işaretidir.</text>
<text x="55" y="1382" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İlk adım: 1) Yüzde/oranları sayıya çevir (sayı = yüzde × toplam).</text>
<text x="55" y="1408" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2) 'Hiçbiri' sayısını bul, toplamdan çıkararak birleşimi (|A∪B|) elde</text>
<text x="55" y="1434" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">et. 3) |A∩B| = |A| + |B| − |A∪B| formülünü uygula. 4) Sonucu şıklarla</text>
<text x="55" y="1460" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">karşılaştırırken 'hem...hem' mi yoksa 'sadece' mi soruluyor dikkat et</text>
<text x="55" y="1486" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">— bu ikisi FARKLI sayılardır!</text>
<line x1="55" y1="1518" x2="945" y2="1518" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1558" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Öğrencilerin En Sık Düştüğü Tuzak</text>
<text x="55" y="1584" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Hata kalıbı: Kesişimi ÇIKARMAYI unutup 'en az biri' sayısını sadece</text>
<text x="55" y="1610" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">|A| + |B| toplayarak bulmak (ortak elemanları iki kez saymak).</text>
<text x="55" y="1636" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Örnek: 50 kişilik bir grupta 30 kişi İngilizce, 25 kişi Almanca</text>
<text x="55" y="1662" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">biliyor, 10 kişi her iki dili de biliyor. En az bir dil bilen kaç</text>
<text x="55" y="1688" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kişidir?</text>
<text x="85" y="1720" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">YANLIŞ: 30 + 25 = 55 kişi (kesişim iki kez sayıldı; ayrıca 55,</text>
<text x="85" y="1746" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">toplam grup sayısı olan 50'yi AŞIYOR — bu imkansız!).</text>
<text x="85" y="1778" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">DOĞRUSU: 30 + 25 − 10 = 45 kişi.</text>
<text x="55" y="1812" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Nasıl fark edilir: Bulduğun 'birleşim' sayısı toplam kişi sayısını</text>
<text x="55" y="1838" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">aşıyorsa (ya da negatif çıkıyorsa), kesinlikle |A∩B|'yi çıkarmayı</text>
<text x="55" y="1864" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">unutmuşsundur — bu, kendi kendini kontrol etmenin en hızlı yoludur.</text>
<line x1="55" y1="1900" x2="945" y2="1900" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1940" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">5) Sıra Sende - Pratik Soru</text>
<text x="55" y="1966" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir spor kulübünde toplam 150 üye vardır. Üyelerin %60'ı yüzme, %40'ı</text>
<text x="55" y="1992" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">tenis yapmaktadır. Üyelerin %10'u ise hiçbir spor dalıyla</text>
<text x="55" y="2018" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">ilgilenmemektedir. Buna göre, hem yüzme hem tenis yapan üye sayısı</text>
<text x="55" y="2044" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kaçtır?</text>
<text x="55" y="2076" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 10      B) 12      C) 15      D) 18      E) 20</text>
<text x="55" y="2110" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendi çözümünü tamamlamadan aşağıdaki cevaba bakma!)</text>
<rect x="55" y="2150" width="890" height="176" fill="#f6f6f6" stroke="#cccccc" stroke-width="1" rx="8"/>
<text x="65" y="2182" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">CEVAP (spoiler):</text>
<text x="65" y="2210" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Yüzme = %60×150=90 , Tenis = %40×150=60 , Hiçbiri = %10×150=15</text>
<text x="65" y="2236" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Birleşim = 150 − 15 = 135</text>
<text x="65" y="2262" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">|Yüzme∩Tenis| = 90 + 60 − 135 = 15</text>
<text x="65" y="2292" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: C) 15</text>
<text x="55" y="2372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">Yarınki konu: Olasılık</text>
</svg>
