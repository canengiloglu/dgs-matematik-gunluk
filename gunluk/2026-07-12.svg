<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2750" viewBox="0 0 1000 2750">
<rect x="0" y="0" width="1000" height="2750" fill="#ffffff"/>
<text x="55" y="60" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">DGS Matematik Günlüğü</text>
<text x="55" y="92" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">12 Temmuz 2026  |  Sınava kalan gün: 7</text>
<line x1="55" y1="108" x2="945" y2="108" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="142" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a56db">Konu: Hız - Zaman - Yol (rotasyon 2. tur)</text>
<text x="55" y="190" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">1) Kısa Kural Hatırlatması</text>
<text x="55" y="224" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Temel formül:</text>
<text x="65" y="276.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Yol = Hız × Zaman</text>
<text x="55" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Buradan türeyen formüller:</text>
<text x="65" y="366.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Hız =</text>
<text x="172.10000000000002" y="353.35" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">Yol</text>
<line x1="137.9" y1="360" x2="206.3" y2="360" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<text x="172.10000000000002" y="378.05" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">Zaman</text>
<text x="65" y="428.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Zaman =</text>
<text x="183.87999999999997" y="415.35" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">Yol</text>
<line x1="161.45999999999998" y1="422" x2="206.29999999999998" y2="422" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<text x="183.87999999999997" y="440.05" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">Hız</text>
<text x="55" y="466" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Aynı yönde hareket eden iki cismin yaklaşma/uzaklaşma hızı,</text>
<text x="55" y="492" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  hızların FARKINA; zıt yönde ise hızların TOPLAMINA eşittir.</text>
<text x="55" y="518" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Birbirine karşı aynı anda çıkıp karşılaşan iki cismin, karşılaşana</text>
<text x="55" y="544" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  kadar aldıkları yolların TOPLAMI, aralarındaki başlangıç mesafesine</text>
<text x="55" y="570" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  eşittir (yetişme sorusunda ise FARK, mesafeye eşittir).</text>
<text x="55" y="600" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">- Birim dönüşümü: km/sa → m/sn için 3,6'ya BÖL; m/sn → km/sa için</text>
<text x="55" y="626" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  3,6 ile ÇARP. Yönü karıştırmak en sık yapılan işlem hatasıdır.</text>
<line x1="55" y1="660" x2="945" y2="660" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="700" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">2) DGS Tarzı Örnek Soru (Hız-Zaman-Yol + Oran-Orantı)</text>
<text x="55" y="734" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A ve B şehirleri arasındaki uzaklık 300 km'dir. Bu iki şehirden aynı</text>
<text x="55" y="760" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">anda birbirine doğru yola çıkan iki araçtan hızlı olanın hızının,</text>
<text x="55" y="786" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">yavaş olanın hızına oranı 3:2'dir. Araçlar yola çıktıktan 2 saat</text>
<text x="55" y="812" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sonra karşılaştıklarına göre, hızlı aracın hızı kaç km/sa'dir?</text>
<text x="55" y="852" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 60      B) 90      C) 100      D) 150      E) 180</text>
<text x="55" y="894" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Çözüm:</text>
<text x="65" y="920" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 1: Hızlı:yavaş hız oranı 3:2 olduğundan hızları 2k (yavaş) ve</text>
<text x="65" y="946" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">3k (hızlı) birim olarak seç (3k:2k = 3:2, verilen oranla uyumlu).</text>
<text x="65" y="972" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 2: 2 saatte her araç kendi hızının 2 katı kadar yol alır:</text>
<text x="65" y="1002" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">yavaş: 2 × 2k = 4k       hızlı: 2 × 3k = 6k</text>
<text x="65" y="1028" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 3: Karşılaşana kadar alınan yolların TOPLAMI, aradaki 300 km'ye</text>
<text x="65" y="1054" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">eşittir; denklemi kur:</text>
<text x="65" y="1084" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">4k + 6k = 300  →  10k = 300  →  k = 30</text>
<text x="65" y="1110" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 4: Hızlı aracın hızını bul:</text>
<text x="65" y="1140" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">hızlı hız = 3k = 3 × 30 = 90 km/sa</text>
<text x="65" y="1174" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: B) 90</text>
<text x="55" y="1210" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Neden diğer şıklar yanlış (ÖSYM tarzı çeldiriciler):</text>
<text x="65" y="1232" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">A) 60 → YANLIŞ OKUMA: Bu, yavaş aracın hızıdır (2k=60); soru hızlı</text>
<text x="65" y="1254" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">aracın hızını soruyor. Oranın ters kurulmasıyla da (yavaş:hızlı yerine</text>
<text x="65" y="1276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">hızlı:yavaş = 2:3 alınırsa) aynı yanlış sayıya ulaşılır.</text>
<text x="65" y="1298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">C) 100 → İŞLEM HATASI: Oran doğru kurulmuş (10k=300, k=30) ama son</text>
<text x="65" y="1320" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">çarpımda (3×30) dikkatsizlikle 100 bulunmuş.</text>
<text x="65" y="1342" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">D) 150 → EKSİK ADIM: Bu, iki aracın hızlarının TOPLAMIDIR (60+90=150,</text>
<text x="65" y="1364" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">yani yaklaşma hızı); oranla paylaştırma adımı atlanıp toplam doğrudan</text>
<text x="65" y="1386" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">cevap sanılmış.</text>
<text x="65" y="1408" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">E) 180 → KAVRAM HATASI (zamanı hesaba katmama): 2 saatlik süre</text>
<text x="65" y="1430" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">çarpılmadan doğrudan 2k+3k=300 kurulmuş (k=60), hızlı hız gerçek</text>
<text x="65" y="1452" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">değerin 2 katına (3×60=180) çıkarılmış.</text>
<line x1="55" y1="1484" x2="945" y2="1484" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1524" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">3) Sınavda Bu Soru Tipini Görünce Strateji</text>
<text x="55" y="1558" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: "...katıdır/oranındadır" + "aynı anda karşılıklı yola</text>
<text x="55" y="1584" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">çıkıyor", "kaç saat sonra karşılaşır/yetişir" → hız-zaman-yol ile</text>
<text x="55" y="1610" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">oran-orantının BİRLİKTE kullanılması gerektiğinin işaretidir.</text>
<text x="55" y="1650" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İlk adım: Verilen orana (X:Y) göre hızları k biriminden yaz (ör.</text>
<text x="55" y="1676" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2k ve 3k); gerçek hız bilinmese de k cinsinden ilerlemek işlemi</text>
<text x="55" y="1702" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">kolaylaştırır ve oranı bozmaz.</text>
<text x="55" y="1728" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Sonra: Her cismin süre içinde aldığı yolu (hız × zaman) k cinsinden</text>
<text x="55" y="1754" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">yaz, verilen toplam/fark mesafeye eşitleyip denklemi kur ve çöz.</text>
<text x="55" y="1780" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">UYARI: "Karşılaşma" sorularında yolların TOPLAMI mesafeye eşittir;</text>
<text x="55" y="1806" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">"yetişme" (aynı yönde kovalama) sorularında yolların FARKI mesafeye</text>
<text x="55" y="1832" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">eşittir — bu ikisini KARIŞTIRMA.</text>
<line x1="55" y1="1866" x2="945" y2="1866" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1906" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Öğrencilerin En Sık Düştüğü Tuzak</text>
<text x="55" y="1940" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Birim Dönüşüm Tuzağı: Soruda bazı hızlar km/sa, bazı süreler dakika</text>
<text x="55" y="1966" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">ya da bazı hızlar m/sn cinsinden karışık verildiğinde, öğrenci</text>
<text x="55" y="1992" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">dönüşüm yönünü karıştırır:</text>
<text x="75" y="2024" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Yanlış:  72 km/sa → 72 × 3,6 = 259,2 m/sn</text>
<text x="75" y="2056" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Doğru:   72 km/sa → 72 ÷ 3,6 = 20 m/sn</text>
<text x="55" y="2082" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Km/sa → m/sn geçişinde sayı KÜÇÜLÜR (3,6'ya bölünür); tam tersi</text>
<text x="55" y="2108" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">yönde (m/sn → km/sa) sayı BÜYÜR (3,6 ile çarpılır).</text>
<text x="55" y="2144" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Nasıl fark edersin: Sonucun büyüklük mertebesine bak. m/sn cinsinden</text>
<text x="55" y="2170" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">hızlar küçüktür (yürüyüş ~1-2, koşu ~5-8, araba ~15-30); km/sa</text>
<text x="55" y="2196" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">cinsinden hızlar büyüktür (araba ~60-120). Sonucun bu aralıkların</text>
<text x="55" y="2222" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">dışına çıkması (ör. "259 m/sn'lik araba") anında hata sinyalidir.</text>
<line x1="55" y1="2256" x2="945" y2="2256" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="2296" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">5) Sıra Sende - Pratik Soru</text>
<text x="55" y="2330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir tren, sabit hızla giderken uzunluğu 150 m olan bir köprüyü baştan</text>
<text x="55" y="2356" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sona 15 saniyede, uzunluğu 90 m olan bir tüneli ise baştan sona 10</text>
<text x="55" y="2382" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">saniyede geçmektedir (trenin köprüyü/tüneli "geçmesi", trenin ön</text>
<text x="55" y="2408" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">ucunun girişten, arka ucunun çıkışa ulaşmasına kadar geçen süredir).</text>
<text x="55" y="2434" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Buna göre trenin hızı kaç m/sn'dir?</text>
<text x="55" y="2474" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 9      B) 10      C) 11      D) 12      E) 15</text>
<text x="55" y="2508" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendi çözümünü tamamlamadan aşağıdaki cevaba bakma!)</text>
<line x1="55" y1="2538" x2="945" y2="2538" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
<rect x="55" y="2550" width="890" height="130" fill="#f6f6f6" stroke="#cccccc" stroke-width="1" rx="8"/>
<text x="75" y="2584" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">CEVAP (spoiler):</text>
<text x="75" y="2614" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Trenin uzunluğu L, hızı v olsun. Köprüde L+150=15v, tünelde</text>
<text x="75" y="2640" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">L+90=10v. Taraf tarafa çıkarınca: 60=5v  →  v = 12 m/sn   →   Doğru şık: D) 12</text>
<text x="55" y="2720" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">Yarınki konu: İşçi/Havuz Problemleri</text>
</svg>
