<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2388" viewBox="0 0 1000 2388">
<rect x="0" y="0" width="1000" height="2388" fill="#ffffff"/>
<text x="55" y="60" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">DGS Matematik Günlüğü</text>
<text x="55" y="92" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">31 Temmuz 2026  |  Sınav 19 Temmuz 2026'da yapıldı (12 gün önce) — pekiştirme turu</text>
<line x1="55" y1="124" x2="945" y2="124" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="158" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a56db">Konu: Yüzde Problemleri</text>
<text x="55" y="206" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">1) Kısa Kural Hatırlatması</text>
<text x="55" y="242" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Bir sayının %k'sı, o sayı ile aşağıdaki kesrin çarpımıdır:</text>
<text x="55" y="298.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sayının %k'sı  =</text>
<text x="251.48" y="298.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a"> sayı ×</text>
<text x="364.36" y="285.35" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">k</text>
<line x1="341.94" y1="292" x2="386.78" y2="292" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
<text x="364.36" y="310.05" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1a1a1a">100</text>
<text x="55" y="332" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">- ÖNEMLİ: "X'in %k'sı" ifadesindeki yüzde SADECE X grubuna uygulanır,</text>
<text x="55" y="358" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  TOPLAM sayıya değil.</text>
<text x="55" y="392" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Grup / karışım sorularında: olumlu durum sayısı, her alt grubun kendi</text>
<text x="55" y="418" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">  yüzdesiyle ayrı ayrı çarpılıp SONRA toplanarak bulunur:</text>
<text x="55" y="470.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">toplam olumlu = grup1 × oran1  +  grup2 × oran2</text>
<text x="55" y="494" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Hatırlatma: Ardışık yüzde değişimlerinde oranlar ÇARPILIR, TOPLANMAZ.</text>
<line x1="55" y1="540" x2="945" y2="540" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="580" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">2) DGS Tarzı Örnek Soru (Yüzde + Alt Grup Oranı)</text>
<text x="55" y="616" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir sınıfta 40 öğrenci vardır. Bu öğrencilerin %60'ı kızdır. Kız</text>
<text x="55" y="642" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">öğrencilerin %25'i, erkek öğrencilerin %50'si gözlük kullanmaktadır.</text>
<text x="55" y="668" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Buna göre, gözlük KULLANMAYAN öğrenci sayısının gözlük KULLANAN</text>
<text x="55" y="694" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">öğrenci sayısına oranı kaçtır?</text>
<text x="55" y="736" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 7:20      B) 3:2      C) 11:9      D) 7:13      E) 13:7</text>
<text x="55" y="778" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Çözüm:</text>
<text x="65" y="812" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 1: Toplam = 40. Kız = %60×40 = 24 ,  Erkek = 40 − 24 = 16.</text>
<text x="65" y="838" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 2: Gözlüklü kız = %25×24 = 6 ,  Gözlüklü erkek = %50×16 = 8.</text>
<text x="65" y="864" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 3: Toplam gözlüklü = 6 + 8 = 14 ,  Gözlüksüz = 40 − 14 = 26.</text>
<text x="65" y="890" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 4: İstenen oran = gözlüksüz : gözlüklü:</text>
<text x="85" y="942.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">26 : 14  =  13 : 7   (2 ile sadeleştir)</text>
<text x="55" y="974" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: E) 13:7</text>
<text x="55" y="1014" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Neden diğer şıklar yanlış (ÖSYM tarzı çeldiriciler):</text>
<text x="65" y="1044" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 7:20 → Gözlüklü öğrencinin TOPLAM içindeki oranı (14:40) hesaplanmış;</text>
<text x="65" y="1066" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">      soru gözlüksüz:gözlüklü oranını istiyor, farklı bir oran sorulmuş (yanlış okuma).</text>
<text x="65" y="1090" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">B) 3:2 → Yüzdeler ters okunmuş: kızların %50'si, erkeklerin %25'i gözlüklü</text>
<text x="65" y="1112" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">      sanılmış (12+4=16 gözlüklü, 24 gözlüksüz → 24:16=3:2).</text>
<text x="65" y="1136" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">C) 11:9 → Alt grup yüzdesi TOPLAM sayıya uygulanmış: %25×40=10 (kız için)</text>
<text x="65" y="1158" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">      ve %50×16=8 → 18 gözlüklü, 22 gözlüksüz → 22:18=11:9 (kavram hatası).</text>
<text x="65" y="1182" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">D) 7:13 → Oran ters kurulmuş: gözlüklü:gözlüksüz = 14:26 = 7:13 hesaplanmış,</text>
<text x="65" y="1204" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">      ama soru gözlüksüz:gözlüklü istiyor (sıra/yön hatası).</text>
<text x="65" y="1228" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">E) 13:7 → DOĞRU CEVAP.</text>
<line x1="55" y1="1268" x2="945" y2="1268" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1308" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">3) Sınavda Bu Soru Tipini Görünce Strateji</text>
<text x="55" y="1344" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: "...'in %k'sı kızdır/erkektir", "kızların %X'i, erkeklerin</text>
<text x="55" y="1370" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">%Y'si..." → bu ifade ALT GRUP yüzdesi olduğunu gösterir; yüzde, cümlede</text>
<text x="55" y="1396" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">en yakın olduğu gruba uygulanır, TOPLAM sayıya değil.</text>
<text x="55" y="1430" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İlk adım: Toplamı yüzdeyle iki (veya daha çok) alt gruba ayır (n → grup1,</text>
<text x="55" y="1456" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">grup2). Sonra HER alt grubun kendi yüzdesini SADECE o alt gruba uygula</text>
<text x="55" y="1482" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">ve sonuçları TOPLA / karşılaştır.</text>
<text x="55" y="1516" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Genel formül:</text>
<text x="55" y="1560.65" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">olumlu_toplam = grup1 × oran1  +  grup2 × oran2</text>
<line x1="55" y1="1588" x2="945" y2="1588" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1628" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Öğrencilerin En Sık Düştüğü Tuzak</text>
<text x="55" y="1664" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Hata kalıbı: Öğrenciler "kızların %25'i..." ifadesindeki %25'i, kız</text>
<text x="55" y="1690" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sayısına değil, YANLIŞLIKLA toplam öğrenci sayısına uygular</text>
<text x="55" y="1716" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">(0,25×24 yerine 0,25×40 hesaplar). Bu, iki ayrı alt grup yüzdesinin bir</text>
<text x="55" y="1742" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">arada verildiği karışım sorularında en sık yapılan hatadır.</text>
<text x="55" y="1776" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Nasıl fark edilir: Cümledeki "X'in %k'sı" yapısında X kelimesinin tam</text>
<text x="55" y="1802" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">olarak neyi işaret ettiğine bak (toplam mı, kız mı, erkek mi, 1. tür mü</text>
<text x="55" y="1828" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2. tür mü). Yüzdeyi HER ZAMAN o alt gruba ait sayıya uygula; bunu işlem</text>
<text x="55" y="1854" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sırasında değil, denklemi KURARKEN netleştir.</text>
<line x1="55" y1="1898" x2="945" y2="1898" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1938" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">5) Sıra Sende - Pratik Soru</text>
<text x="55" y="1974" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir fabrikada 200 çalışan vardır. Çalışanların %45'i kadındır. Kadın</text>
<text x="55" y="2000" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">çalışanların %20'si, erkek çalışanların %40'ı mühendistir. Buna göre,</text>
<text x="55" y="2026" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">mühendis OLMAYAN kadın çalışan sayısının mühendis OLAN erkek</text>
<text x="55" y="2052" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">çalışan sayısına oranı kaçtır?</text>
<text x="55" y="2092" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendi çözümünü tamamlamadan aşağıdaki cevaba bakma!)</text>
<line x1="55" y1="2148" x2="945" y2="2148" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
<rect x="55" y="2178" width="890" height="130" fill="#f6f6f6" stroke="#cccccc" stroke-width="1" rx="8"/>
<text x="75" y="2204" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">CEVAP (spoiler):</text>
<text x="75" y="2232" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Kadın = %45×200 = 90 ,  Erkek = 110.</text>
<text x="75" y="2256" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Mühendis kadın = %20×90 = 18  →  Mühendis OLMAYAN kadın = 90 − 18 = 72.</text>
<text x="75" y="2280" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Mühendis erkek = %40×110 = 44.</text>
<text x="75" y="2304" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Oran = 72 : 44 = 18 : 11   →   CEVAP: 18:11</text>
<text x="55" y="2348" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">Yarınki konu: Hız - Zaman - Yol</text>
</svg>
