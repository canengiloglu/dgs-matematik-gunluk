<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2348" viewBox="0 0 1000 2348">
<rect x="0" y="0" width="1000" height="2348" fill="#ffffff"/>
<text x="55" y="60" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">DGS Matematik Günlüğü</text>
<text x="55" y="92" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">29 Temmuz 2026  |  Belirtilen sınav tarihi (19 Temmuz 2026) geçti — tekrar/pratik modu</text>
<line x1="55" y1="116" x2="945" y2="116" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="150" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a56db">Konu: Geometri (Alan / Çevre)  —  3. tur, gün 9</text>
<text x="55" y="198" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">1) Kısa Kural Hatırlatması</text>
<text x="55" y="234" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Dikdörtgen: alan = a × b     çevre = 2 × (a + b)</text>
<text x="55" y="260" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Kare: alan = a²     çevre = 4 × a</text>
<text x="55" y="286" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">- Kenarlar ORAN ile verilmişse (örn. a:b = 4:3), ortak çarpanı k al:</text>
<text x="75" y="312" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">a = 4k , b = 3k   (k &gt; 0)</text>
<text x="55" y="346" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">- ÖNEMLİ: Bir kenar uzatılır/kısaltılırsa, YENİ kenar uzunluğu ile işlem</text>
<text x="55" y="372" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  yapılır; eski k değeri kenar uzunluklarını bulmak için kullanılır, sonra</text>
<text x="55" y="398" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#b3261e">  değişiklik bu bulunan sayısal değerlere uygulanır.</text>
<line x1="55" y1="432" x2="945" y2="432" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">2) DGS Tarzı Örnek Soru (Geometri + Oran-Orantı)</text>
<text x="55" y="508" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir dikdörtgenin uzun kenarının kısa kenarına oranı 4:3'tür. Bu</text>
<text x="55" y="534" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">dikdörtgenin çevresi 70 cm'dir. Kısa kenar 3 cm kısaltılıp uzun kenar</text>
<text x="55" y="560" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2 cm uzatılırsa elde edilen yeni dikdörtgenin alanı kaç cm² olur?</text>
<text x="55" y="602" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 300      B) 324      C) 264      D) 68      E) 1134</text>
<text x="55" y="644" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Çözüm:</text>
<text x="65" y="678" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 1: Ortak çarpan k: kısa kenar = 3k, uzun kenar = 4k.</text>
<text x="65" y="704" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 2: Çevre = 2 × (3k + 4k) = 14k = 70  →  k = 5.</text>
<text x="65" y="730" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 3: Orijinal kenarlar: kısa = 15 cm, uzun = 20 cm.</text>
<text x="65" y="756" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 4: Değişiklik uygula — kısa kenar 3 azalır, uzun kenar 2 artar:</text>
<text x="85" y="782" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">yeni kısa = 15 − 3 = 12 ,  yeni uzun = 20 + 2 = 22</text>
<text x="65" y="808" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Adım 5: Yeni alan = 12 × 22 = 264 cm²</text>
<text x="55" y="848" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f7b3f">Cevap: C) 264</text>
<text x="55" y="894" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">Neden diğer şıklar yanlış (ÖSYM tarzı çeldiriciler):</text>
<text x="65" y="924" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 300  →  Değişiklik hiç uygulanmadan orijinal kenarların alanı hesaplanmış</text>
<text x="65" y="948" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        (15×20); soru YENİ dikdörtgenin alanını istiyor (eksik adım).</text>
<text x="65" y="972" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">B) 324  →  Hangi kenara ne yapılacağı ters karıştırılmış: kısa kenara +3,</text>
<text x="65" y="996" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        uzun kenara −2 uygulanmış (18×18=324); soru kısa kenarı KISALT,</text>
<text x="65" y="1020" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        uzun kenarı UZAT diyor — yön hatası.</text>
<text x="65" y="1044" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">D) 68  →  Alan yerine yeni dikdörtgenin ÇEVRESİ hesaplanmış</text>
<text x="65" y="1068" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        (2×(12+22)=68); alan-çevre kavram karışıklığı.</text>
<text x="65" y="1092" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">E) 1134  →  Çevre formülünde 2 çarpanı unutulup (a+b=70 sanılmış),</text>
<text x="65" y="1116" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        k=10 bulunmuş; yanlış k ile orijinal kenarlar 30 ve 40 çıkmış,</text>
<text x="65" y="1140" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">        değişiklik sonrası 27×42=1134 elde edilmiş (formül hatası).</text>
<line x1="55" y1="1188" x2="945" y2="1188" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1228" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">3) Sınavda Bu Soru Tipini Görünce Strateji</text>
<text x="55" y="1264" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İpucu kelimeler: "kenarların oranı ... dir", "kısaltılırsa / uzatılırsa",</text>
<text x="55" y="1290" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">"yeni dikdörtgenin alanı/çevresi" → bunlar iki aşamalı bir soru olduğunu</text>
<text x="55" y="1316" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">gösterir: önce ORANLA verilen kenarları k cinsinden bul, sonra tarif edilen</text>
<text x="55" y="1342" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">DEĞİŞİKLİĞİ yeni kenarlara uygula.</text>
<text x="55" y="1384" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">İlk adım: Ortak çarpanı k tanımla (a=4k, b=3k gibi); verilen çevre/alan</text>
<text x="55" y="1410" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">bilgisiyle k'yı bul. Hangi formülün (alan mı çevre mi) isteneceğini</text>
<text x="55" y="1436" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">sorunun SON cümlesinden netleştir; oradaki formülleri karıştırma:</text>
<text x="85" y="1476" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Dikdörtgen: Alan = a × b ,  Çevre = 2 × (a + b)</text>
<text x="85" y="1515.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Kare: Alan = </text>
<text x="230.02" y="1515.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">a</text>
<text x="240.56" y="1508.3" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.05" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">2</text>
<text x="255.411" y="1515.95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a"> ,  Çevre = 4 × a</text>
<line x1="55" y1="1550" x2="945" y2="1550" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1590" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">4) Kendin Çöz: Pratik Soru (Geometri + Yüzde)</text>
<text x="55" y="1626" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Bir dikdörtgenin uzun kenarının kısa kenarına oranı 4:3'tür. Bu</text>
<text x="55" y="1652" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">dikdörtgenin çevresi 84 cm'dir. Dikdörtgenin alanı, bir karenin</text>
<text x="55" y="1678" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">alanının %75'i kadar olduğuna göre, karenin çevresi kaç cm'dir?</text>
<text x="55" y="1720" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">A) 72      B) 84      C) 88      D) 96      E) 108</text>
<text x="55" y="1750" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15.5" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">(Kendin çöz — cevap sayfanın en altında ayrıca belirtilmiştir, önce kendin dene.)</text>
<line x1="55" y1="1784" x2="945" y2="1784" stroke="#e5e5e5" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="1824" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" font-weight="bold" font-style="normal" text-anchor="start" fill="#1a1a1a">5) Öğrencilerin Bu Konuda En Sık Düştüğü Tuzak</text>
<text x="55" y="1860" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Hata kalıbı: Kenarları oranla verilen bir dikdörtgende sonradan yapılan</text>
<text x="55" y="1886" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">bir değişiklik (uzatma/kısaltma) tarif edildiğinde, öğrenci değişikliği</text>
<text x="55" y="1912" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">SADECE bir kenara uygulayıp diğer kenarı olduğu gibi bırakır ya da her</text>
<text x="55" y="1938" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">iki kenara da AYNI işlemi (örn. ikisine de +2) uygular — oysa soru genelde</text>
<text x="55" y="1964" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">her kenar için FARKLI bir işlem tarif eder (biri artar, diğeri azalır).</text>
<text x="55" y="2006" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">Nasıl fark edilir: Soruyu cümle cümle oku; "kısa kenar ... kısaltılıp,</text>
<text x="55" y="2032" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">uzun kenar ... uzatılırsa" gibi ifadelerde HER kenar için ayrı bir işlem</text>
<text x="55" y="2058" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">belirtilir. Yeni kenarları a' ve b' gibi AYRI değişkenlerle yaz, hangisine</text>
<text x="55" y="2084" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">ne uygulandığını yazılı olarak kontrol ettikten sonra alan/çevre formülüne</text>
<text x="55" y="2110" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#1a1a1a">geç. Kontrol yapmadan zihinden işlem yapmak bu tuzağın en sık nedenidir.</text>
<line x1="55" y1="2150" x2="945" y2="2150" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
<text x="55" y="2184" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="italic" text-anchor="start" fill="#555555">Pratik Sorunun Cevabı (spoiler — çözmeden bakma!)</text>
<text x="55" y="2210" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">Kısa kenar=3k, uzun kenar=4k → çevre 2(3k+4k)=14k=84 → k=6 → kısa=18, uzun=24.</text>
<text x="55" y="2232" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">Dikdörtgen alanı = 18×24 = 432. Bu, kare alanının %75'i olduğundan:</text>
<text x="55" y="2254" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">kare alanı = 432 ÷ 0,75 = 576 = 24². Kare kenarı = 24 cm → kare çevresi = 4×24 = 96 cm.</text>
<text x="55" y="2276" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#555555">Doğru şık: D) 96</text>
</svg>
